<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Риелторские услуги{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<div class="container">
    <header>
        <h1 class="site-title"><a href="{{ url_for('home.index') }}">Дом и Ключ</a></h1>
        <p class="site-subtitle">Агентство риелторских услуг</p>
        <nav>
            <a href="{{ url_for('home.index') }}">Главная</a>
            <a href="{{ url_for('properties.list') }}">Объекты</a>
            <a href="{{ url_for('clients.list') }}">Клиенты</a>
            <a href="{{ url_for('agents.list') }}">Агенты</a>
            <a href="{{ url_for('deals.list') }}">Сделки</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        Учебный проект по базам данных
    </footer>
</div>
</body>
</html>
